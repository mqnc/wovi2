    <script type="module">
        import *as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
        import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
        import { ConvexHull } from 'three/addons/math/ConvexHull.js';


        export function jsonToAxis(json) {
            if (json == "x") { return new THREE.Vector3(1, 0, 0) }
            else if (json == "y") { return new THREE.Vector3(0, 1, 0) }
            else if (json == "z") { return new THREE.Vector3(0, 0, 1) }
            else { return jsonToVector(json).normalize() }
        }

        export function jsonToVector(json) {
            console.assert(Array.isArray(json) && json.length == 3)
            return new THREE.Vector3(json[0], json[1], json[2])
        }

        export function jsonToQuaternion(json, order) {
            console.assert(Array.isArray(json) && json.length == 4)
            if (order === "xyzw") {
                return new THREE.Quaternion(json[0], json[1], json[2], json[3])
            }
            else if (order === "wxyz") {
                return new THREE.Quaternion(json[1], json[2], json[3], json[0])
            }
            else { throw new Error("invalid quaternion order") }
        }


        class ConvexGeometry2 extends THREE.BufferGeometry {
            // modified from this: https://github.com/mrdoob/three.js/blob/master/examples/jsm/geometries/ConvexGeometry.js
            // uses setFromObject instead of setFromPoints
            constructor(obj) {
                super();
                const vertices = [];
                const normals = [];
                const convexHull = new ConvexHull().setFromObject(obj);
                const faces = convexHull.faces;
                for (let i = 0; i < faces.length; i++) {
                    const face = faces[i];
                    let edge = face.edge;
                    do {
                        const point = edge.head().point;
                        vertices.push(point.x, point.y, point.z);
                        normals.push(face.normal.x, face.normal.y, face.normal.z);
                        edge = edge.next;
                    } while (edge !== face.edge);
                }
                this.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                this.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
            }
        }

        class DepthPeelingRenderer {

            constructor(parameters) {
                const {
                    layers = 20,
                    samples = 0,
                    colorSpace = THREE.SRGBColorSpace,
                    depthBuffer = true,
                    ...threeParameters
                } = parameters;

                this.renderer = new THREE.WebGLRenderer(threeParameters);

                this.numLayers = layers
                this.samples = samples
                this.colorSpace = colorSpace
                this.depthBuffer = depthBuffer
                this.renderTarget = new THREE.WebGLRenderTarget(1, 1, { colorSpace, depthBuffer, samples });
                this.compositeTarget = new THREE.WebGLRenderTarget(1, 1, { colorSpace, depthBuffer, samples });

                this.layers = [];
                this.depthTexture = new THREE.DepthTexture(1, 1, THREE.FloatType);
                this.depthTexture2 = new THREE.DepthTexture(1, 1, THREE.FloatType);
                this.opaqueDepthTexture = new THREE.DepthTexture(1, 1, THREE.FloatType);
                this.copyQuad = new FullScreenQuad(new THREE.MeshBasicMaterial());

                // We can't inherit from WebGLRenderer since it assigns all its methods in its constructor
                // so we can't override them. Instead we favor composition over inheritance
                // and forward everything that is not overridden to the renderer member.
                return new Proxy(this, {
                    get: (target, prop, receiver) => {
                        if (prop in target) return Reflect.get(target, prop, receiver);
                        const value = target.renderer[prop];
                        return typeof value === 'function' ? value.bind(target.renderer) : value;
                    },
                    set: (target, prop, value) => {
                        if (prop in target) target[prop] = value;
                        else target.renderer[prop] = value;
                        return true;
                    }
                });
            }

            setPixelRatio(value) {
                this.renderer.setPixelRatio(value)
                this._resize()
            }

            setSize(width, height, updateStyle) {
                this.renderer.setSize(width, height, updateStyle)
                this._resize()
            }

            _resize() {
                const [w, h] = this.renderer.getSize(new THREE.Vector2()).toArray()
                const dpr = this.renderer.getPixelRatio()

                this.compositeTarget.setSize(dpr * w, dpr * h);
                this.renderTarget.setSize(dpr * w, dpr * h);

                this.layers.forEach(rt => rt.dispose());
                this.layers.length = 0;

                this.depthTexture.image.width = dpr * w;
                this.depthTexture.image.height = dpr * h;
                this.depthTexture.dispose();

                this.depthTexture2.image.width = dpr * w;
                this.depthTexture2.image.height = dpr * h;
                this.depthTexture2.dispose();

                this.opaqueDepthTexture.image.width = dpr * w;
                this.opaqueDepthTexture.image.height = dpr * h;
                this.opaqueDepthTexture.dispose();
            }

            render(scene, camera) {
                const [w, h] = this.renderer.getSize(new THREE.Vector2()).toArray()
                const dpr = this.renderer.getPixelRatio()

                const originalTarget = this.renderer.getRenderTarget()

                while (this.layers.length < this.numLayers) {
                    this.layers.push(new THREE.WebGLRenderTarget(w * dpr, h * dpr, {
                        colorSpace: this.colorSpace,
                        depthBuffer: this.depthBuffer,
                        samples: this.samples,
                    }));
                }

                while (this.layers.length > this.numLayers) {
                    this.layers.pop().dispose();
                }

                let opaqueMaterials = new Set()
                let transparentMaterials = new Set()

                scene.traverse(({ material }) => {
                    if (material && material.isDepthPeelMaterial) {
                        if (material.transparent) { transparentMaterials.add(material) }
                        else { opaqueMaterials.add(material) }
                    }
                })

                // render opaque layer
                for (let material of opaqueMaterials) { material.visible = true }
                for (let material of transparentMaterials) { material.visible = false }
                this.renderTarget.depthTexture = this.opaqueDepthTexture;
                this.renderer.setRenderTarget(this.renderTarget);
                this.renderer.render(scene, camera);
                this.renderer.setRenderTarget(null);

                this.copyQuad.material.map = this.renderTarget.texture;
                this.copyQuad.material.blending = THREE.NoBlending;
                this.copyQuad.material.transparent = false;
                this.copyQuad.material.depthTest = false;
                this.copyQuad.material.depthWrite = false;
                this.copyQuad.render({ render: this.renderer.render.bind(this.renderer) });
                this.renderTarget.depthTexture = null;

                const clearAlpha = this.renderer.getClearAlpha();
                const clearColor = this.renderer.getClearColor(new THREE.Color());

                // perform depth peeling
                for (let material of opaqueMaterials) { material.visible = false }
                for (let material of transparentMaterials) {
                    material.visible = true
                    material.enableDepthPeeling = true;
                    material.opaqueDepth = this.opaqueDepthTexture;
                    material.blending = THREE.CustomBlending;
                    material.blendDst = THREE.ZeroFactor;
                    material.blendSrc = THREE.OneFactor;
                    material.depthWrite = true;
                    material.forceSinglePass = true;
                    this.renderer.getDrawingBufferSize(material.resolution);
                }
                for (let i = 0; i < this.numLayers; i++) {

                    const depthTextures = [this.depthTexture, this.depthTexture2];
                    const writeDepthTexture = depthTextures[(i + 1) % 2];
                    const nearDepthTexture = depthTextures[i % 2];

                    // update the materials, skipping the near check
                    for (let material of transparentMaterials) {
                        material.nearDepth = i === 0 ? null : nearDepthTexture;
                    }

                    // perform rendering
                    let currTarget = i === 0 ? this.compositeTarget : this.renderTarget;
                    currTarget = this.layers[i];
                    currTarget.depthTexture = writeDepthTexture;

                    this.renderer.setRenderTarget(currTarget);
                    this.renderer.setClearColor(0, 0);
                    this.renderer.render(scene, camera);
                    this.renderer.setRenderTarget(null);
                }

                this.renderer.setRenderTarget(originalTarget);
                this.renderer.setClearColor(clearColor, clearAlpha);

                // render transparent layers
                for (let i = this.numLayers - 1; i >= 0; i--) {

                    this.autoClear = false;
                    this.layers[i].depthTexture = null;
                    this.copyQuad.material.map = this.layers[i].texture;
                    this.copyQuad.material.blending = THREE.NormalBlending;
                    this.copyQuad.material.transparent = true;
                    this.copyQuad.material.depthTest = false;
                    this.copyQuad.material.depthWrite = false;
                    this.copyQuad.render({ render: this.renderer.render.bind(this.renderer) });

                }

                this.renderer.autoClear = true;

            }
        }

        function DepthPeelMaterialMixin(baseMaterial) {
            return class extends baseMaterial {
                isDepthPeelMaterial = true

                get nearDepth() {
                    return this._uniforms.nearDepth.value;
                }

                set nearDepth(v) {
                    this._uniforms.nearDepth.value = v;
                    this.needsUpdate = true;
                }

                get opaqueDepth() {
                    return this._uniforms.opaqueDepth.value;
                }

                set opaqueDepth(v) {
                    this._uniforms.opaqueDepth.value = v;
                }

                get enableDepthPeeling() {
                    return this._enableDepthPeeling;
                }

                set enableDepthPeeling(v) {
                    if (this._enableDepthPeeling !== v) {
                        this._enableDepthPeeling = v;
                        this.needsUpdate = true;
                    }
                }

                get resolution() {
                    return this._uniforms.resolution.value;
                }

                constructor(...args) {
                    super(...args);
                    this._firstPass = false;
                    this._enableDepthPeeling = false;
                    this._uniforms = {
                        nearDepth: { value: null },
                        opaqueDepth: { value: null },
                        resolution: { value: new THREE.Vector2() },
                    };
                }

                customProgramCacheKey() {
                    return `${Number(this.enableDepthPeeling)}|${Number(this.nearDepth)}`;
                }

                onBeforeCompile(shader) {
                    shader.uniforms = {
                        ...shader.uniforms,
                        ...this._uniforms,
                    };
                    shader.fragmentShader =
                /* glsl */`
                    #define DEPTH_PEELING ${Number(this.enableDepthPeeling)}
                    #define FIRST_PASS ${Number(!this.nearDepth)}
                    
                    #if DEPTH_PEELING
                    
                    uniform sampler2D nearDepth;
                    uniform sampler2D opaqueDepth;
                    uniform vec2 resolution;

                    #endif

                    ${shader.fragmentShader}
                `.replace('void main() {', /* glsl */`
                    void main() {
                        #if DEPTH_PEELING
                        vec2 screenUV = gl_FragCoord.xy / resolution;
                        if ( texture2D( opaqueDepth, screenUV ).r < gl_FragCoord.z ) {
                            discard;
                        }
                        #if ! FIRST_PASS
                        if ( texture2D( nearDepth, screenUV ).r >= gl_FragCoord.z - 1e-6 ) {
                            discard;
                        }
                        #endif
                        #endif
                ` );
                }
            };
        }


        export function checkFields(obj, requiredKeys, optionalKeys = []) {
            const objKeys = Object.keys(obj)

            const missingRequiredFields = requiredKeys.filter(key => !objKeys.includes(key))
            if (missingRequiredFields.length > 0) {
                console.error(obj, "misses required", missingRequiredFields)
                throw new Error("see above")
            }

            if (optionalKeys !== "*") {
                const unexpectedFields = objKeys.filter(key => !requiredKeys.includes(key) && !optionalKeys.includes(key))
                if (unexpectedFields.length > 0) {
                    console.error(obj, "contains unexpected", unexpectedFields)
                    throw new Error("see above")
                }
            }
        }


        export const haloVertexShader = `
            varying vec3 nml;
            varying vec3 pos;

            void main() {
                pos = (modelMatrix * vec4(position, 1.0)).xyz;
                nml = (modelMatrix * vec4(normal, 0.0)).xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
            }
        `
        export const haloFragmentShader = `
            uniform vec3 glowColor;
            varying vec3 pos;
            varying vec3 nml;
            void main() {
                vec3 view = normalize(pos-cameraPosition);
                float intensity = 0.1 + 0.9 * pow(1.0 - abs(dot(normalize(nml), view)), 3.0);
                //gl_FragColor = vec4( glowColor, 0.9 * intensity + 0.1 );
                gl_FragColor = vec4( glowColor, intensity );
            }
        `

        const depthPeelShaderMaterial = DepthPeelMaterialMixin(THREE.ShaderMaterial)

        // const coreMaterial = new THREE.MeshStandardMaterial({
        // 	roughness: 0.8,
        // 	metalness: 0.2,
        // })
        export let coreMaterial = new depthPeelShaderMaterial({
            uniforms: {
                glowColor: { value: new THREE.Color(0.584, 0.059, 0.329) },
            },
            vertexShader: haloVertexShader,
            fragmentShader: haloFragmentShader,
            transparent: true
        });
        export function setCoreMaterial(material) { coreMaterial = material }

        export let marginMaterial = new depthPeelShaderMaterial({
            uniforms: {
                glowColor: { value: new THREE.Color(0, 0.408, 0.459) },
            },
            vertexShader: haloVertexShader,
            fragmentShader: haloFragmentShader,
            side: THREE.BackSide,
            transparent: true
        });
        export function setMarginMaterial(material) { marginMaterial = material }

        let numCircleCorners = 20, icoDetail, sphereTemplateGeometry
        icoDetail = Math.floor(numCircleCorners / 5 - 1)
        sphereTemplateGeometry = new THREE.IcosahedronGeometry(1, icoDetail)
        export let sphereTemplate = new THREE.Mesh(sphereTemplateGeometry)

        export function setCurvatureSmoothness(newNumCircleCorners) {
            numCircleCorners = newNumCircleCorners
            icoDetail = Math.floor(numCircleCorners / 5 - 1)
            sphereTemplateGeometry = new THREE.IcosahedronGeometry(1, icoDetail)
            sphereTemplate = new THREE.Mesh(sphereTemplateGeometry)
        }
        setCurvatureSmoothness(numCircleCorners)

        let origin = { xyz: [0, 0, 0], qxyzw: [0, 0, 0, 1] }

        const commonShapeKeys = ["margin", "collides", "stickyForce", "visuals"]

        export function jsonToShapeObject(json, shapeId) {
            checkFields(json, ["kind"], [...commonShapeKeys,
                "center", "radius", "pose", "size", "height", "axis", "points", "vertices", "faces"])

            switch (json.kind) {
                case "box": return jsonToBoxObject(json, shapeId)
                case "sphere": return jsonToSphereObject(json, shapeId)
                case "cylinder": return jsonToCylinderObject(json, shapeId)
                case "orangeNet": return jsonToOrangeNetObject(json, shapeId)
                case "mesh": // return parseMesh(json)
                default: throw new Error("unhandled shape type: " + json.kind)
            }
        }

        function makeOrangeNetGeometry(points, radius) {
            let helper = new THREE.Group()
            for (const p of points) {
                let s = sphereTemplate.clone()
                s.position.set(p[0], p[1], p[2])
                const r = radius
                s.scale.set(r, r, r)
                helper.add(s)
            }
            let geometry = new ConvexGeometry2(helper)
            geometry.computeVertexNormals()
            return geometry
        }

        function jsonToBoxObject(json, shapeId) {
            checkFields(json, ["kind", "size"], [...commonShapeKeys, "pose"])

            let result = new THREE.Group()
            result.name = shapeId
            let coreGeometry = new THREE.BoxGeometry(json.size[0], json.size[1], json.size[2])
            let coreMesh = new THREE.Mesh(coreGeometry, coreMaterial.clone())
            coreMesh.name = "core"
            result.add(coreMesh)
            let margin = json.margin ?? 0
            let marginGeometry
            if (margin == 0) {
                marginGeometry = coreGeometry.clone()
            }
            else {
                let [w2, h2, d2] = [json.size[0] / 2, json.size[1] / 2, json.size[2] / 2]
                marginGeometry = makeOrangeNetGeometry([
                    [-w2, -h2, -d2], [-w2, -h2, d2], [-w2, h2, -d2], [-w2, h2, d2],
                    [w2, -h2, -d2], [w2, -h2, d2], [w2, h2, -d2], [w2, h2, d2]
                ], margin)
            }
            let marginMesh = new THREE.Mesh(marginGeometry, marginMaterial.clone())
            marginMesh.name = "margin"
            result.add(marginMesh)
            result.matrixAutoUpdate = false
            return result
        }

        function jsonToSphereObject(json, shapeId) {
            checkFields(json, ["kind", "radius"], [...commonShapeKeys, "center"])

            let result = new THREE.Group()
            result.name = shapeId
            let coreMesh = sphereTemplate.clone()
            coreMesh.name = "core"
            coreMesh.material = coreMaterial.clone()
            let r = json.radius
            coreMesh.scale.set(r, r, r)
            result.add(coreMesh)
            let marginMesh = sphereTemplate.clone()
            marginMesh.name = "margin"
            marginMesh.material = marginMaterial.clone()
            r = json.radius + json.margin
            marginMesh.scale.set(r, r, r)
            result.add(marginMesh)
            result.position.copy(jsonToVector(json.center ?? [0, 0, 0]))
            return result
        }

        function jsonToOrangeNetObject(json, shapeId) {
            checkFields(json, ["kind", "points", "radius"], commonShapeKeys)

            let result = new THREE.Group()
            result.name = shapeId
            let coreGeometry = makeOrangeNetGeometry(json.points, json.radius)
            let coreMesh = new THREE.Mesh(coreGeometry, coreMaterial.clone())
            coreMesh.name = "core"
            result.add(coreMesh)
            let margin = json.margin ?? 0
            let marginGeometry = makeOrangeNetGeometry(json.points, json.radius + margin)
            let marginMesh = new THREE.Mesh(marginGeometry, marginMaterial.clone())
            marginMesh.name = "margin"
            result.add(marginMesh)
            return result
        }

        function jsonToCylinderObject(json, shapeId) {
            checkFields(json, ["kind", "radius", "height", "axis"], [...commonShapeKeys, "center"])

            let poseHelper = new THREE.Group()
            poseHelper.name = "helper"
            let coreGeometry = new THREE.CylinderGeometry(json.radius, json.radius, json.height, numCircleCorners)
            let coreMesh = new THREE.Mesh(coreGeometry, coreMaterial.clone())
            coreMesh.name = "core"
            coreMesh.rotation.x = Math.PI / 2
            poseHelper.add(coreMesh)
            let margin = json.margin ?? 0
            if (margin == 0) {
                let marginGeometry = coreGeometry.clone()
                let marginMesh = new THREE.Mesh(marginGeometry, marginMaterial.clone())
                marginMesh.name = "margin"
                marginMesh.rotation.x = Math.PI / 2
                poseHelper.add(marginMesh)
            }
            else {
                let helper = new THREE.Group()
                let torusGeometry = new THREE.TorusGeometry(json.radius, margin, numCircleCorners, numCircleCorners)
                let torus1 = new THREE.Mesh(torusGeometry)
                let torus2 = torus1.clone()
                torus1.position.setZ(json.height / 2)
                torus2.position.setZ(-json.height / 2)
                helper.add(torus1)
                helper.add(torus2)
                let marginGeometry = new ConvexGeometry2(helper)
                marginGeometry.computeVertexNormals()
                let marginMesh = new THREE.Mesh(marginGeometry, marginMaterial.clone())
                marginMesh.name = "margin"
                poseHelper.add(marginMesh)
            }


            poseHelper.matrix.multiply(new THREE.Matrix4().lookAt(
                new THREE.Vector3(0, 0, 0),
                jsonToAxis(json.axis),
                new THREE.Vector3(0, 0, 1)
            )).setPosition(jsonToVector(json.center ?? [0, 0, 0]))

            let result = new THREE.Group()
            result.name = shapeId
            result.add(poseHelper)

            return result
        }





        function shapeDataToMeshes(data) {
            switch (data.kind) {
                case "Compound": {
                    let result = new THREE.Group()
                    for (const child of data.children) {
                        let meshes = shapeDataToMeshes(child.shape)
                        meshes.position.set(...child.trafo.xyz)
                        meshes.quaternion.set(...child.trafo.qxyzw)
                        result.add(meshes)
                    }
                    return result;
                }
                case "Box":
                    let box = jsonToShapeObject({
                        kind: "box",
                        size: data.size,
                        margin: data.margin
                    })
                    box.matrixAutoUpdate = true
                    return box
                case "Sphere": {
                    let result = new THREE.Group()
                    let coreMesh = sphereTemplate.clone()
                    coreMesh.material = coreMaterial.clone()
                    let r = data.radius
                    coreMesh.scale.set(r, r, r)
                    result.add(coreMesh)
                    let marginMesh = sphereTemplate.clone()
                    marginMesh.material = marginMaterial.clone()
                    r = data.radius + data.margin
                    marginMesh.scale.set(r, r, r)
                    result.add(marginMesh)
                    return result;
                }
                case "CylinderZ":
                    let cylinder = jsonToShapeObject({
                        kind: "cylinder",
                        radius: data.radius,
                        height: data.height,
                        axis: "z",
                        margin: data.margin
                    })
                    return cylinder
                case "InflatedConvexHull": {
                    let result = new THREE.Group()
                    let helper = new THREE.Group()
                    for (const p of data.points) {
                        let s = sphereTemplate.clone()
                        s.position.set(p[0], p[1], p[2])
                        const r = data.radius
                        s.scale.set(r, r, r)
                        helper.add(s)
                    }
                    let coreGeometry = new ConvexGeometry2(helper)
                    coreGeometry.computeVertexNormals()
                    let coreMesh = new THREE.Mesh(coreGeometry)
                    coreMesh.material = coreMaterial.clone()
                    result.add(coreMesh)
                    for (const s of helper.children) {
                        const r = data.radius + data.margin
                        s.scale.set(r, r, r)
                    }
                    let marginGeometry = new ConvexGeometry2(helper)
                    let marginMesh = new THREE.Mesh(marginGeometry)
                    marginMesh.material = marginMaterial.clone()
                    result.add(marginMesh)
                    return result;
                }
                case "ReferenceMesh":
                    let loader
                    if (data.path.toLowerCase().endsWith("dae")) {
                        loader = new ColladaLoader();
                    }
                    else if (data.path.toLowerCase().endsWith("glb") || data.path.toLowerCase().endsWith("gltf")) {
                        loader = new GLTFLoader();
                    }
                    else {
                        throw new Error("unhandled file format: " + data.path);
                    }
                    let handle = new THREE.Group()
                    loader.load(data.path,
                        (result) => {
                            result.scene.rotation.set(0, 0, 0)
                            handle.add(result.scene);
                        },
                        () => { },
                        (error) => {
                            console.log(error)
                        }
                    );
                    return handle
                // case "MultiSphere":
                // 	break;
                // case "VisualMesh":
                // 	break;
                default:
                    console.error("unknown shape kind: " + data.kind)
            }
        }




        const DepthPeelStandardMaterial = DepthPeelMaterialMixin(THREE.MeshStandardMaterial);

        const scene = new THREE.Scene();
        window.scene = scene

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-1, 1.5, 1.2);
        camera.up.set(0, 0, 1);

        const renderer = new DepthPeelingRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        // const loader = new GLTFLoader()
        // loader.load(
        //     "models_/ur5e.glb",
        //     function (gltf) { scene.add(gltf.scene) },
        //     function (xhr) {
        //         // console.log((xhr.loaded / xhr.total * 100) + '% loaded')
        //     },
        //     function (error) {
        //         console.error('error loading ' + path)
        //         reject()

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileCubemapShader()
        const cubeLoader = new THREE.CubeTextureLoader();
        let textureCube = cubeLoader.load([
            `background/environment.jpg`,

            `background/environment.jpg`,
            `background/environment.jpg`,
            `background/environment.jpg`
        ], function (texture) {
            let pmrem = pmremGenerator.fromCubemap(texture)
            scene.environment = pmrem.texture;
        });

        let textureCube2 = cubeLoader.load([
            `background/px.jpg`,
            `background/nx.jpg`,
            `background/py.jpg`,
            `background/ny.jpg`,
            `background/pz.jpg`,
            `background/nz.jpg`
        ], function (texture) {
            let pmrem = pmremGenerator.fromCubemap(texture)
            scene.background = pmrem.texture;
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.update();

        const tcp = new THREE.AxesHelper(0.1)
        tcp.position.set(-0.5, -0.1, 0.2)
        tcp.quaternion.set(0, 1, 0, 0)
        scene.add(tcp)


        const gizmo = new TransformControls(camera, renderer.domElement)
        gizmo.addEventListener('dragging-changed', function (event) {
            controls.enabled = !event.value;
        });
        gizmo.attach(tcp);
        gizmo.setMode("rotate")
        gizmo.space = "local"
        gizmo.setSize(0.4)
        scene.add(gizmo.getHelper());

        document.addEventListener("keydown", (e) => {
            if (e.repeat) return;

            switch (e.key) {
                case "t": gizmo.setMode("translate"); break;
                case "r": gizmo.setMode("rotate"); break;
                case "l": gizmo.space = "local"; break;
                case "g": gizmo.space = "global"; break;
                case "Escape": gizmo.detach(); break;
                case "e": gizmo.attach(tcp); break;
                default:
                    if (/^[0-9]$/.test(e.key)) {
                        for (const obj of scene.children) {
                            if (obj.name && obj.name == "__handle__" + e.key) {
                                gizmo.attach(obj);
                                break;
                            }
                        }
                    }
            }


        });

        scene.add(new THREE.AxesHelper(1));

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dir = new THREE.DirectionalLight(0xffffff, 1);
        dir.position.set(1, 1, 1);
        scene.add(dir);
        const sun = new THREE.PointLight(0xffffff, 100)
        sun.position.set(4, 5, 6)
        scene.add(sun)

        const geometry = new THREE.BufferGeometry();

        //const forceFieldMaterial = new DepthPeelStandardMaterial({ transparent: true, opacity: 0.5, color: 0x00ff00, side: THREE.DoubleSide });
        const forceFieldMaterial = new depthPeelShaderMaterial({
            uniforms: {
                glowColor: { value: new THREE.Color(0.3, 1, 0) },
            },
            vertexShader: haloVertexShader,
            fragmentShader: haloFragmentShader,
            transparent: true,
            side: THREE.DoubleSide
        });


        const mesh1 = new THREE.Mesh(geometry, forceFieldMaterial);
        //const mesh2 = new THREE.Mesh(geometry, material2);
        scene.add(mesh1);
        //scene.add(mesh2);

        const ws = new WebSocket('ws://localhost:8080/ws');
        //const ws = { send: () => { } }
        ws.binaryType = 'arraybuffer';

        let handles = { "tcp": tcp };
        let prevStates = {};

        let setUp = false;

        ws.onmessage = (ev) => {

            if (typeof ev.data == "string") {
                // json -> scene visualization, shapes and poses of objects

                const json = JSON.parse(ev.data);

                console.log(json)

                if (!setUp && !json.__isUpdate__) {
                    for (let objData of json) {
                        let obj = shapeDataToMeshes(objData.shape)
                        obj.name = objData.name
                        obj.position.set(...objData.trafo.xyz)
                        obj.quaternion.set(...objData.trafo.qxyzw)
                        scene.add(obj)
                        let vis = shapeDataToMeshes(objData.visual)
                        obj.add(vis)

                        if (/^\d\./.test(obj.name)) { // does name start with digit and "."? -> make gizmo-movable
                            let helper = new THREE.Object3D();
                            helper.name = "__handle__" + obj.name[0];
                            handles[obj.name[0]] = helper;
                            scene.add(helper)
                            helper.position.copy(obj.position)
                            helper.quaternion.copy(obj.quaternion)
                        }
                    }

                    setUp = true
                }
                if (setUp && json.__isUpdate__) {
                    for (const [objectName, trafo] of Object.entries(json)) {
                        if (objectName[0] == "_") { continue }
                        const obj = scene.getObjectByName(objectName)
                        obj.position.set(...trafo.xyz)
                        obj.quaternion.set(...trafo.qxyzw)
                    }
                }
            }
            else {
                // binary -> workspace visualization, mesh data from marching cubes
                const buf = ev.data;
                const view = new DataView(buf);
                let o = 0;

                const vcount = view.getUint32(o, true); o += 4;
                const icount = view.getUint32(o, true); o += 4;

                const positions = new Float32Array(buf, o, vcount * 3);
                o += vcount * 3 * 4;

                const normals = new Float32Array(buf, o, vcount * 3);
                o += vcount * 3 * 4;

                const indices = new Uint32Array(buf, o, icount);

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
                geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                geometry.computeBoundingSphere();
            }
        };

        ws.onopen = () => {
            setInterval(() => {
                for (const [id, obj] of Object.entries(handles)) {
                    const state = obj.matrixWorld.clone().transpose().elements.join(",");
                    const last = prevStates[id];
                    if (state !== last) {
                        ws.send(`${id}:${state}`);
                        prevStates[id] = state;
                    }
                }
            }, 50);
        };

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        function resize() {
            const w = window.innerWidth
            const h = window.innerHeight
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        resize()
        window.addEventListener('resize', resize);

    </script>
</body>

</html>
